<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="board-size" content="390x844">
<title>New habit</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#14161a;background:#fff;-webkit-font-smoothing:antialiased}
.s{width:390px;height:844px;position:relative;overflow:hidden;background:#F7F6F2;display:flex;flex-direction:column}
.bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:15px;font-weight:600}
.h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:4px 20px 4px}
.sub{color:#6b6f76;font-size:15px;margin:0 20px 16px}
.card{background:#fff;border-radius:20px;margin:0 16px 12px;padding:16px;box-shadow:0 1px 2px rgba(20,22,26,.04),0 4px 16px rgba(20,22,26,.05)}
.row{display:flex;align-items:center;gap:12px}
.ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.t{font-size:16px;font-weight:600}.m{font-size:13px;color:#6b6f76;margin-top:4px}
.chk{margin-left:auto;width:28px;height:28px;border-radius:50%;border:2px solid #d9dbe0;flex:none}
.chk.on{background:#3E7BFA;border-color:#3E7BFA;box-shadow:inset 0 0 0 4px #fff}
.btn{display:flex;align-items:center;justify-content:center;height:54px;border-radius:16px;background:#14161a;color:#fff;font-size:16px;font-weight:600;text-decoration:none;margin:0 16px}
.btn.blue{background:#3E7BFA}
.tabs{position:absolute;left:16px;right:16px;bottom:20px;height:64px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:space-around;box-shadow:0 8px 24px rgba(20,22,26,.10)}
.tab{font-size:12px;font-weight:600;color:#9aa0a8;display:flex;flex-direction:column;align-items:center;gap:4px}.tab.on{color:#14161a}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:#fff;font-size:13px;font-weight:600;margin-right:8px}
.pill.on{background:#14161a;color:#fff}
.ring{width:132px;height:132px;border-radius:50%;background:conic-gradient(#3E7BFA 0 72%,#E8EAF0 72% 100%);display:flex;align-items:center;justify-content:center}
.ring>div{width:104px;height:104px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding:0 4px}
.bars div{flex:1;border-radius:8px;background:#E3EAFE}.bars div.on{background:#3E7BFA}
.field{height:52px;border-radius:14px;background:#fff;border:1.5px solid #e6e7eb;display:flex;align-items:center;padding:0 16px;font-size:16px;margin:0 16px 12px;color:#14161a}
.lab{font-size:13px;font-weight:600;color:#6b6f76;margin:8px 20px 8px}
</style>
</head>
<body>
<div class="s">
  <div class="bar"><a href="home.html" style="color:inherit;text-decoration:none">Cancel</a><span>New habit</span><span style="color:#3E7BFA">Save</span></div>
  <div class="lab">Name</div><div class="field">Stretch</div>
  <div class="lab">Icon</div>
  <div style="display:flex;gap:8px;margin:0 16px 12px"><div class="ic" style="background:#EEF3FF;outline:2px solid #3E7BFA;outline-offset:2px">🤸</div><div class="ic" style="background:#E8F7F1;">🍎</div><div class="ic" style="background:#FFF4E5;">🎧</div><div class="ic" style="background:#F3EEFF;">🌙</div><div class="ic" style="background:#FDECEC;">🚲</div></div>
  <div class="lab">Repeat</div>
  <div style="display:flex;gap:8px;margin:0 16px 12px"><div style="flex:1;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;background:#14161a;color:#fff">M</div><div style="flex:1;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;background:#14161a;color:#fff">T</div><div style="flex:1;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;background:#14161a;color:#fff">W</div><div style="flex:1;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;background:#14161a;color:#fff">T</div><div style="flex:1;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;background:#14161a;color:#fff">F</div><div style="flex:1;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;background:#fff;color:#9aa0a8">S</div><div style="flex:1;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;background:#fff;color:#9aa0a8">S</div></div>
  <div class="lab">Reminder</div><div class="field" style="justify-content:space-between">7:30 AM <span style="width:44px;height:26px;border-radius:12px;background:#3E7BFA;position:relative"><span style="position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff"></span></span></div>
  <a class="btn blue" href="home.html" style="margin-top:auto;margin-bottom:28px">Create habit</a>
</div>
</body>
</html>
